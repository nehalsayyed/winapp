name: Build React Native Notification APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 1. Initialize React Native Expo App on the fly
      - name: Scaffold React Native App
        run: |
          npx create-expo-app@latest my-app --template blank --no-install
          cd my-app
          npm install
          npx expo install expo-notifications

      # 2. Inject Code with Native Local Notifications
      - name: Inject Notification App Code
        run: |
          cat << 'EOF' > my-app/App.js
          import React, { useEffect } from 'react';
          import { StyleSheet, Text, View, Button, Alert, Platform } from 'react-native';
          import * as Notifications from 'expo-notifications';

          // Configure notification behavior
          Notifications.setNotificationHandler({
            handleNotification: async () => ({
              shouldShowAlert: true,
              shouldPlaySound: true,
              shouldSetBadge: false,
            }),
          });

          export default function App() {
            useEffect(() => {
              // Request notification permissions on startup
              async function requestPermissions() {
                const { status } = await Notifications.requestPermissionsAsync();
                if (status !== 'granted') {
                  Alert.alert('Permission needed', 'Please grant notification permissions!');
                }
              }
              requestPermissions();
            }, []);

            async function triggerLocalNotification() {
              await Notifications.scheduleNotificationAsync({
                content: {
                  title: "Native Notification! 🚀",
                  body: "This notification was generated natively inside React Native.",
                  data: { data: 'sample data' },
                },
                trigger: { seconds: 2 },
              });
            }

            return (
              <View style={styles.container}>
                <Text style={styles.title}>React Native Native Notifications</Text>
                <Button 
                  title="Trigger Notification (2s delay)" 
                  onPress={triggerLocalNotification} 
                />
              </View>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              backgroundColor: '#1e1e2e',
              alignItems: 'center',
              justifyContent: 'center',
              padding: 20,
            },
            title: {
              fontSize: 20,
              color: '#cdd6f4',
              marginBottom: 20,
              textAlign: 'center',
              fontWeight: 'bold',
            },
          });
          EOF

      # 3. Eject Native Android Project Code & Prebuild
      - name: Generate Native Android Folder
        run: |
          cd my-app
          npx expo prebuild --platform android --no-install

      # 4. Build Android APK via Gradle
      - name: Build APK with Gradle
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 5. Output and Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReactNative-NotificationApp
          path: my-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          
