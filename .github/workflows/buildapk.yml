name: Build Ionic Capacitor Notification APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 1. Initialize Ionic + Capacitor App on the fly
      - name: Scaffold Ionic App
        run: |
          npm install -g @ionic/cli
          ionic start my-app blank --type=react --no-interactive --no-git
          cd my-app
          npm install @capacitor/core @capacitor/android @capacitor/local-notifications

      # 2. Add Capacitor Android Platform & Inject Code
      - name: Inject Notification App Code & Sync
        run: |
          cd my-app
          npx cap init "Ionic Notification App" "com.example.ionicnotification" --web-dir dist

          # Overwrite App.tsx with Native Notification logic
          cat << 'EOF' > src/App.tsx
          import React from 'react';
          import { IonApp, IonContent, IonHeader, IonTitle, IonToolbar, IonButton } from '@ionic/react';
          import { LocalNotifications } from '@capacitor/local-notifications';

          /* Core CSS required for Ionic components to work properly */
          import '@ionic/react/css/core.css';
          import '@ionic/react/css/structure.css';
          import '@ionic/react/css/typography.css';

          const App: React.FC = () => {
            const sendNotification = async () => {
              // Request permissions
              const perm = await LocalNotifications.requestPermissions();
              if (perm.display === 'granted') {
                // Schedule local notification
                await LocalNotifications.schedule({
                  notifications: [
                    {
                      title: "Capacitor Native Alert! 🚀",
                      body: "Notification triggered natively from Ionic Capacitor!",
                      id: 1,
                      schedule: { at: new Date(Date.now() + 2000) }, // 2 seconds delay
                    }
                  ]
                });
              }
            };

            return (
              <IonApp>
                <IonHeader>
                  <IonToolbar color="dark">
                    <IonTitle>Ionic Notification APK</IonTitle>
                  </IonToolbar>
                </IonHeader>
                <IonContent className="ion-padding ion-text-center">
                  <h2>Native Local Notifications</h2>
                  <IonButton expand="block" onClick={sendNotification}>
                    Trigger Notification (2s)
                  </IonButton>
                </IonContent>
              </IonApp>
            );
          };

          export default App;
          EOF

          # Build Web Dist Folder & Add Android Native Project
          npm run build
          npx cap add android
          npx cap sync android

      # 3. Build Debug APK with Gradle
      - name: Build APK with Gradle
        run: |
          cd my-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 4. Upload APK Artifact (Using wildcard to guarantee match)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IonicCapacitor-NotificationApp
          path: my-app/android/app/build/outputs/apk/**/*.apk
          
