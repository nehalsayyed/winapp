name: Generate & Build ExoPlayer Compose App

on:
  
  workflow_dispatch:

jobs:
  build:
    name: Generate Project & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Create Android Project Directory Structure
      - name: Scaffold Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/streamer
          mkdir -p app/src/main/res/values

      # 2. Generate Root settings.gradle.kts
      - name: Create settings.gradle.kts
        run: |
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ExoPlayerStreamer"
          include(":app")
          EOF

      # 3. Generate Root build.gradle.kts
      - name: Create Root build.gradle.kts
        run: |
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

      # 4. Generate App build.gradle.kts (With Media3 ExoPlayer & Compose)
      - name: Create App build.gradle.kts
        run: |
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.streamer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.streamer"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")

              // Media3 / ExoPlayer Dependencies
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
              implementation("androidx.media3:media3-common:1.2.1")
          }
          EOF

      # 5. Generate AndroidManifest.xml
      - name: Create AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:permission="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="ExoStreamer"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # 6. Generate MainActivity.kt (Compose + Media3 ExoPlayer)
      - name: Create MainActivity.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/example/streamer/MainActivity.kt
          package com.example.streamer

          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = Color(0xFF0A0C10)
                          ) {
                              ExoPlayerStreamScreen(
                                  streamUrl = "http://173.13.181.58/axis-cgi/mjpg/video.cgi"
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          fun ExoPlayerStreamScreen(streamUrl: String) {
              val context = LocalContext.current

              // Initialize ExoPlayer
              val exoPlayer = remember {
                  ExoPlayer.Builder(context).build().apply {
                      val mediaItem = MediaItem.fromUri(Uri.parse(streamUrl))
                      setMediaItem(mediaItem)
                      prepare()
                      playWhenReady = true
                  }
              }

              DisposableEffect(Unit) {
                  onDispose {
                      exoPlayer.release()
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp),
                  contentAlignment = androidx.compose.ui.Alignment.Center
              ) {
                  Card(
                      shape = RoundedCornerShape(20.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .aspectRatio(16f / 9f)
                          .clip(RoundedCornerShape(20.dp))
                  ) {
                      AndroidView(
                          factory = { ctx ->
                              PlayerView(ctx).apply {
                                  player = exoPlayer
                                  useController = false
                              }
                          },
                          modifier = Modifier.fillMaxSize()
                      )
                  }
              }
          }
          EOF

      # 7. Setup Gradle Wrapper & Build APK
      - name: Setup Gradle & Build
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      # 8. Upload Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExoPlayer-Streamer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
