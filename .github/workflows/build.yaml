name: Build Capacitor Android APK

on:
  
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: Create www directory & copy source files
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f "capacitor.config.json" ]; then cp capacitor.config.json www/; fi

      # Step 2: Initialize NPM and Install Capacitor
      - name: Install Capacitor CLI & Core
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # Step 3: Add Android Platform & Sync Web Assets
      - name: Add Android & Sync
        run: |
          npx cap add android
          npx cap sync android

      # Step 4: FIX BLACK SCREEN - Allow HTTP Cleartext Traffic & Internet Permissions
      - name: Configure Android Manifest (Allow HTTP Streams)
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          # Enable usesCleartextTraffic in application tag
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_PATH
          
          # Ensure Internet permission is explicit
          if ! grep -q "android.permission.INTERNET" $MANIFEST_PATH; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" \/>' $MANIFEST_PATH
          fi

      # Step 5: Fix Kotlin Duplicate Classes
      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              }
          }
          EOF

      # Step 6: Inject Native Tweaks (Disable Text Selection Menu)
      - name: Customize MainActivity for Native Feel
        run: |
          MAIN_ACTIVITY_PATH="android/app/src/main/java/com/mycam/liveapp/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY_PATH" ]; then
            cat << 'EOF' > $MAIN_ACTIVITY_PATH
          package com.mycam.liveapp;

          import android.view.ActionMode;
          import android.view.Menu;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onActionModeStarted(ActionMode mode) {
                  Menu menu = mode.getMenu();
                  menu.clear();
                  super.onActionModeStarted(mode);
              }
          }
          EOF
          fi

      # Step 7: Build Debug APK using Gradle
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Step 8: Upload Output APK as Workflow Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-cam-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
