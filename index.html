<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Live Cam App</title>
    <!-- Fallback CSS so page renders even if CDN fails -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #090d16;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header {
            padding: 12px 16px;
            background-color: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .select-box {
            background-color: #374151;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            width: 60%;
            font-size: 12px;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 260px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .status {
            padding: 12px;
            font-size: 11px;
            color: #9ca3af;
            word-break: break-all;
            text-align: center;
        }
        .error-log {
            color: #ef4444;
            font-size: 12px;
            padding: 10px;
            background: #2a0808;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <span style="font-size: 14px; font-weight: bold;">Cam Viewer</span>
            <select id="camSelect" class="select-box" onchange="switchCam(this.value)">
                <!-- Populated via JS -->
            </select>
        </div>

        <div class="video-container">
            <img id="streamImg" alt="Stream Preview" />
            <div id="loadingText" style="position: absolute; color: #888; font-size: 13px;">
                Loading camera...
            </div>
        </div>

        <div class="status" id="urlDisplay">Connecting...</div>
    </div>

    <!-- Screen Debugger (If JS fails, error shows here instead of black screen) -->
    <div id="debugBox" class="error-log"></div>

    <script>
        // Catch runtime errors and show them on screen instead of blacking out
        window.onerror = function(msg, url, line) {
            var debugBox = document.getElementById('debugBox');
            debugBox.style.display = 'block';
            debugBox.innerHTML = '<b>App Error:</b> ' + msg + ' (Line ' + line + ')';
            return false;
        };

        const cameras = [
            { name: "Camera 1 (Anklam)", url: "http://webcam.anklam.de/axis-cgi/mjpg/video.cgi" },
            { name: "Camera 2 (Vilhelmina)", url: "http://webcam1.vilhelmina.se/axis-cgi/mjpg/video.cgi" },
            { name: "Camera 3 (Tusten)", url: "http://live1.tusten.no:8080/axis-cgi/mjpg/video.cgi" }
        ];

        const img = document.getElementById('streamImg');
        const select = document.getElementById('camSelect');
        const loading = document.getElementById('loadingText');
        const urlDisplay = document.getElementById('urlDisplay');

        function init() {
            // Populate Dropdown
            cameras.forEach(function(cam, i) {
                var opt = document.createElement('option');
                opt.value = i;
                opt.textContent = cam.name;
                select.appendChild(opt);
            });

            loadCamera(0);
        }

        function loadCamera(index) {
            loading.style.display = 'block';
            img.style.display = 'none';
            
            var target = cameras[index];
            var streamUrl = target.url + '?t=' + new Date().getTime();
            
            urlDisplay.textContent = target.url;
            img.src = streamUrl;

            img.onload = function() {
                loading.style.display = 'none';
                img.style.display = 'block';
            };

            img.onerror = function() {
                loading.textContent = 'Failed to load stream (Offline/Blocked)';
            };
        }

        function switchCam(val) {
            loadCamera(parseInt(val));
        }

        // Prevent right-click/long press popups
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        // Initialize when DOM ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
