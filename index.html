<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Live Cams</title>
    <style>
        /* --- NATIVE CSS RESET & APP SHELL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            touch-action: none;
            overscroll-behavior: none;
            position: fixed;
        }

        /* Safe area padding for notches and gesture bars */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: #090d16;
        }

        /* --- APP BAR --- */
        .app-bar {
            height: 56px;
            background-color: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #1f2937;
            z-index: 10;
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Native Button Styling */
        .native-btn {
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        .native-btn:active {
            transform: scale(0.94);
            background-color: #374151;
        }

        /* --- MAIN VIEWPORT --- */
        .viewport {
            flex: 1;
            position: relative;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .overlay-loader {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 13px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- BOTTOM CONTROL BAR --- */
        .bottom-bar {
            padding: 12px 16px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cam-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cam-name {
            font-size: 14px;
            font-weight: 600;
            color: #f3f4f6;
        }

        .cam-url {
            font-size: 11px;
            color: #6b7280;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- CUSTOM NATIVE BOTTOM SHEET (NO BROWSER MODALS) --- */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #161e2e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            z-index: 101;
            transform: translateY(100%);
            transition: transform 0.28s cubic-bezier(0, 0, 0.2, 1);
            border-top: 1px solid #2d3748;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .bottom-sheet.active {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background-color: #4b5563;
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .sheet-title {
            font-size: 15px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .sheet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .sheet-item {
            padding: 14px 16px;
            background-color: #1f2937;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            color: #e5e7eb;
            border: 1px solid transparent;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .sheet-item:active {
            transform: scale(0.98);
            background-color: #374151;
        }

        .sheet-item.selected {
            border-color: #3b82f6;
            background-color: #1e293b;
            color: #60a5fa;
        }

        .check-icon {
            width: 16px;
            height: 16px;
            fill: #3b82f6;
            display: none;
        }

        .sheet-item.selected .check-icon {
            display: block;
        }

        /* Error Log Overlay */
        .error-toast {
            position: absolute;
            top: 70px;
            left: 16px;
            right: 16px;
            background-color: #7f1d1d;
            color: #fecaca;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Native App Bar -->
        <header class="app-bar">
            <div class="app-title">
                <span class="live-dot"></span>
                <span>Live Cam</span>
            </div>
            <button class="native-btn" onclick="openSheet()">
                <span>Select Cam</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
            </button>
        </header>

        <!-- Canvas Stream Viewport -->
        <main class="viewport">
            <canvas id="streamCanvas"></canvas>
            
            <div id="loader" class="overlay-loader">
                <div class="spinner"></div>
                <span id="loaderText">Connecting stream...</span>
            </div>

            <div id="errorToast" class="error-toast"></div>
        </main>

        <!-- Native Bottom Control Bar -->
        <footer class="bottom-bar">
            <div class="cam-info">
                <span id="camNameDisplay" class="cam-name">--</span>
                <span id="camUrlDisplay" class="cam-url">--</span>
            </div>
            <button class="native-btn" onclick="reloadStream()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
        </footer>
    </div>

    <!-- Custom Material Bottom Sheet Component -->
    <div id="backdrop" class="sheet-backdrop" onclick="closeSheet()"></div>
    <div id="sheet" class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Select Camera</div>
        <div id="sheetList" class="sheet-list"></div>
    </div>

    <script>
        // Error Handler to prevent white/black screens
        window.onerror = function(msg, url, line) {
            const toast = document.getElementById('errorToast');
            toast.style.display = 'block';
            toast.textContent = 'App Error: ' + msg + ' (Line ' + line + ')';
            return false;
        };

        const cameras = [
            { name: "Camera 1 (Anklam)", url: "http://webcam.anklam.de/axis-cgi/mjpg/video.cgi" },
            { name: "Camera 2 (Vilhelmina)", url: "http://webcam1.vilhelmina.se/axis-cgi/mjpg/video.cgi" },
            { name: "Camera 3 (Tusten)", url: "http://live1.tusten.no:8080/axis-cgi/mjpg/video.cgi" }
        ];

        let currentIndex = 0;
        let hiddenImg = new Image();
        let isRendering = false;

        const canvas = document.getElementById('streamCanvas');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const camNameDisplay = document.getElementById('camNameDisplay');
        const camUrlDisplay = document.getElementById('camUrlDisplay');

        function init() {
            renderSheetItems();
            loadCamera(0);
            
            // Adjust canvas aspect ratio dynamically
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
        }

        function loadCamera(index) {
            currentIndex = index;
            const target = cameras[index];
            
            camNameDisplay.textContent = target.name;
            camUrlDisplay.textContent = target.url;
            loader.style.display = 'flex';
            loaderText.textContent = "Connecting stream...";

            // Destroy previous image connection
            hiddenImg.onload = null;
            hiddenImg.onerror = null;
            hiddenImg = new Image();
            
            const streamUrl = target.url + '?t=' + new Date().getTime();
            hiddenImg.src = streamUrl;

            hiddenImg.onload = function() {
                loader.style.display = 'none';
                if (!isRendering) {
                    isRendering = true;
                    requestAnimationFrame(drawFrame);
                }
            };

            hiddenImg.onerror = function() {
                loader.style.display = 'flex';
                loaderText.textContent = "Stream offline or blocked.";
            };

            renderSheetItems();
        }

        // Render Frame directly onto hardware-accelerated Canvas
        function drawFrame() {
            if (hiddenImg.complete && hiddenImg.naturalWidth !== 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Calculate aspect ratio containment
                const hRatio = canvas.width / hiddenImg.width;
                const vRatio = canvas.height / hiddenImg.height;
                const ratio = Math.min(hRatio, vRatio);
                
                const centerShift_x = (canvas.width - hiddenImg.width * ratio) / 2;
                const centerShift_y = (canvas.height - hiddenImg.height * ratio) / 2;

                ctx.drawImage(
                    hiddenImg, 
                    0, 0, hiddenImg.width, hiddenImg.height,
                    centerShift_x, centerShift_y, hiddenImg.width * ratio, hiddenImg.height * ratio
                );
            }
            requestAnimationFrame(drawFrame);
        }

        function reloadStream() {
            loadCamera(currentIndex);
        }

        /* --- BOTTOM SHEET LOGIC --- */
        function renderSheetItems() {
            const list = document.getElementById('sheetList');
            list.innerHTML = '';

            cameras.forEach((cam, i) => {
                const item = document.createElement('div');
                item.className = 'sheet-item' + (i === currentIndex ? ' selected' : '');
                item.onclick = () => {
                    loadCamera(i);
                    closeSheet();
                };

                item.innerHTML = `
                    <span>${cam.name}</span>
                    <svg class="check-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                `;
                list.appendChild(item);
            });
        }

        function openSheet() {
            document.getElementById('backdrop').classList.add('active');
            document.getElementById('sheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('backdrop').classList.remove('active');
            document.getElementById('sheet').classList.remove('active');
        }

        // Lock context menus and browser behavior globally
        window.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
