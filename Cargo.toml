[package]
name = "rust_android_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "main.rs"

[dependencies]
slint = "1.5"

[package.metadata.android]
package = "com.example.rustandroidapp"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 33
